[package]
name = "l10n-rust-tool"
version = "0.1.0"
edition = "2021"
description = "Extract and rewrite CJK UI strings in Rust sources per l10n/SPEC.md"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha1 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[[bin]]
name = "l10n-rust-tool"
path = "src/main.rs"
